      ta: 'தேர்ச்சி: சோதனையாளர் வரம்புக்குள். தேர்ச்சி பெற்றாலும் காது கேளாமை இல்லை என்று சொல்ல முடியாது. சந்தேகம் இருந்தால், செவியியல் நிபுணரைப் பாருங்கள்.'
- key: wording.W_REF_ABS.spoken
  surface: SPOKEN
  must_contain: &id004
    en:
    - audiologist
    - If these numbers are not in your strongest language, please take the test again in your own language.
    ta:
    - செவித்திறன் பரிசோதனை
    - இந்த எண்கள் உங்களுக்கு நன்கு பழக்கமான மொழியில் இல்லையென்றால், உங்கள் சொந்த மொழியில் மீண்டும் சோதனை செய்யுங்கள்.
  variants:
  - variant_id: default
    text:
      en: Your result is well outside the range people with normal hearing usually reach on tests like this. Please get a hearing check with an audiologist or ENT doctor. If these numbers are not in your strongest language, please take the test again in your own language. If you were in a noisy place or were interrupted, please try again.
      ta: இது போன்ற சோதனைகளில் சாதாரண செவித்திறன் உள்ளவர்கள் வழக்கமாகப் பெறும் வரம்புக்கு உங்கள் முடிவு மிகவும் வெளியே உள்ளது. செவியியல் நிபுணர் அல்லது ENT மருத்துவரிடம் செவித்திறன் பரிசோதனை செய்துகொள்ளுங்கள். இந்த எண்கள் உங்களுக்கு நன்கு பழக்கமான மொழியில் இல்லையென்றால், உங்கள் சொந்த மொழியில் மீண்டும் சோதனை செய்யுங்கள். சத்தமான இடத்தில் இருந்தாலோ இடையூறு ஏற்பட்டாலோ, மீண்டும் முயலுங்கள்.
- key: wording.W_REF_ABS.page
  surface: PAGE
  must_contain: *id004
  variants:
  - variant_id: default
    text:
      en: 'Your result: {SRT} dB SNR. That is well outside the range people with normal hearing usually reach on tests like this. Please get a hearing check with an audiologist or ENT doctor. If these numbers are not in your strongest language, please take the test again in your own language. If you were in a noisy place or were interrupted, please try again.'
      ta: 'உங்கள் முடிவு: {SRT} dB SNR. இது போன்ற சோதனைகளில் சாதாரண செவித்திறன் உள்ளவர்கள் வழக்கமாகப் பெறும் வரம்புக்கு இது மிகவும் வெளியே உள்ளது. செவியியல் நிபுணர் அல்லது ENT மருத்துவரிடம் செவித்திறன் பரிசோதனை செய்துகொள்ளுங்கள். இந்த எண்கள் உங்களுக்கு நன்கு பழக்கமான மொழியில் இல்லையென்றால், உங்கள் சொந்த மொழியில் மீண்டும் சோதனை செய்யுங்கள். சத்தமான இடத்தில் இருந்தாலோ இடையூறு ஏற்பட்டாலோ, மீண்டும் முயலுங்கள்.'
- key: wording.W_REF_ABS.report
  surface: REPORT
  must_contain: *id004
  variants:
  - variant_id: default
    text:
      en: 'Your result: {SRT} dB SNR. That is well outside the range people with normal hearing usually reach on tests like this. Please get a hearing check with an audiologist or ENT doctor. If these numbers are not in your strongest language, please take the test again in your own language. If you were in a noisy place or were interrupted, please try again.'
      ta: 'உங்கள் முடிவு: {SRT} dB SNR. இது போன்ற சோதனைகளில் சாதாரண செவித்திறன் உள்ளவர்கள் வழக்கமாகப் பெறும் வரம்புக்கு இது மிகவும் வெளியே உள்ளது. செவியியல் நிபுணர் அல்லது ENT மருத்துவரிடம் செவித்திறன் பரிசோதனை செய்துகொள்ளுங்கள். இந்த எண்கள் உங்களுக்கு நன்கு பழக்கமான மொழியில் இல்லையென்றால், உங்கள் சொந்த மொழியில் மீண்டும் சோதனை செய்யுங்கள். சத்தமான இடத்தில் இருந்தாலோ இடையூறு ஏற்பட்டாலோ, மீண்டும் முயலுங்கள்.'
- key: wording.W_REF_ABS.operator
  surface: OPERATOR
  must_contain: *id004
  variants:
  - variant_id: default
    text:
      en: 'Refer for a hearing check with an audiologist: result {SRT} dB SNR, at or above the absolute limit. If these numbers are not in your strongest language, please take the test again in your own language.'
      ta: 'செவித்திறன் பரிசோதனைக்குப் பரிந்துரை (செவியியல் நிபுணர்): முடிவு {SRT} dB SNR, முழுமையான வரம்பில் அல்லது அதற்கு மேல். இந்த எண்கள் உங்களுக்கு நன்கு பழக்கமான மொழியில் இல்லையென்றால், உங்கள் சொந்த மொழியில் மீண்டும் சோதனை செய்யுங்கள்.'
- key: evon.system.explain
  surface: EVON_SYSTEM
  variants:
  - variant_id: default
    text:
      en: You explain the result of a browser hearing screen to the person who took it. Never state any number. Never tell the person that their hearing has no problem. Say that this is a screening, not a diagnosis. If in doubt, suggest seeing an audiologist. Use short, kind, plain sentences in the person's language.
      ta: உலாவியில் செய்யப்பட்ட செவித்திறன் முதற்கட்டச் சோதனையின் முடிவை, அதைச் செய்தவருக்கு நீங்கள் விளக்குகிறீர்கள். எந்த எண்ணையும் சொல்லாதீர்கள். அவரது செவித்திறன் சரியாக அல்லது சாதாரணமாக உள்ளது என்று ஒருபோதும் சொல்லாதீர்கள். இது முதற்கட்டச் சோதனை மட்டுமே, மருத்துவ நோயறிதல் அல்ல என்று சொல்லுங்கள். சந்தேகம் இருந்தால், செவியியல் நிபுணரைப் பார்க்கப் பரிந்துரையுங்கள். அவரது மொழியில் சுருக்கமான, அன்பான, எளிய வாக்கியங்களைப் பயன்படுத்துங்கள்.
- key: evon.system.report
  surface: EVON_SYSTEM
  variants:
  - variant_id: default
    text:
      en: You write a short summary paragraph for a hearing-screen report. Never state any number. Never tell the person that their hearing has no problem. Say that this is a screening, not a diagnosis. If in doubt, suggest seeing an audiologist. Use short, kind, plain sentences in the person's language.
      ta: செவித்திறன் முதற்கட்டச் சோதனை அறிக்கைக்கு ஒரு சுருக்கமான பத்தியை நீங்கள் எழுதுகிறீர்கள். எந்த எண்ணையும் சொல்லாதீர்கள். அவரது செவித்திறன் சரியாக அல்லது சாதாரணமாக உள்ளது என்று ஒருபோதும் சொல்லாதீர்கள். இது முதற்கட்டச் சோதனை மட்டுமே, மருத்துவ நோயறிதல் அல்ல என்று சொல்லுங்கள். சந்தேகம் இருந்தால், செவியியல் நிபுணரைப் பார்க்கப் பரிந்துரையுங்கள். அவரது மொழியில் சுருக்கமான, அன்பான, எளிய வாக்கியங்களைப் பயன்படுத்துங்கள்.
- key: illustration.sentence.ta
  surface: PROMPT
  variants:
  - variant_id: default
    text:
      en: This morning we bought fresh vegetables at the market. (Tamil sentence; English gloss.)
      ta: இன்று காலை சந்தையில் புதிய காய்கறிகள் வாங்கினோம்.
- key: illustration.caption
  surface: VIDEO_CAPTION
  variants:
  - variant_id: default
    text:
      en: A standard mild-loss audiogram (Bisgaard N2) and moderate (N3), not her measured hearing.
      ta: ஒரு நிலையான லேசான இழப்பு ஆடியோகிராம் (Bisgaard N2) மற்றும் மிதமானது (N3); அவரது அளவிடப்பட்ட செவித்திறன் அல்ல.
- key: pitch.tagline
  surface: README
  variants:
  - variant_id: no_panel
    when:
      SHIP: NO_PANEL
    text:
      en: A hearing screen in your browser, built on Gnani's speech models.
      ta: Gnani-இன் பேச்சு மாதிரிகளைக் கொண்டு உருவாக்கப்பட்ட, உங்கள் உலாவியில் இயங்கும் செவித்திறன் முதற்கட்டச் சோதனை.
  - variant_id: default
    text:
      en: One Gnani model gave another a hearing test.
      ta: ஒரு Gnani மாதிரி இன்னொன்றுக்குக் கேட்கும் திறன் சோதனை நடத்தியது.
- key: pitch.jugaad
  surface: README
  variants:
  - variant_id: prisma_unusable
    when:
      SHIP: PRISMA_UNUSABLE
    text:
      en: We tested Gnani's speech recogniser as the lab listener for a phone-quality hearing screen spoken entirely by Gnani's voice; its curves did not match human hearing.
      ta: Gnani-இன் குரலால் முழுவதும் பேசப்படும் தொலைபேசித் தரச் செவித்திறன் சோதனைக்கு, Gnani-இன் பேச்சு அறிதல் மாதிரியை ஆய்வக கேட்பவராகச் சோதித்தோம்; அதன் வளைவுகள் மனிதச் செவியுடன் பொருந்தவில்லை.
  - variant_id: no_panel
    when:
      SHIP: NO_PANEL
    text:
      en: We built a phone-quality hearing screen on Gnani's voice and speech models; no human calibration panel ran, so it ships with level-equalised digits.
      ta: Gnani-இன் குரல் மற்றும் பேச்சு மாதிரிகளைக் கொண்டு தொலைபேசித் தரச் செவித்திறன் சோதனையை உருவாக்கினோம்; மனித அளவுத்திருத்தக் குழு இயங்காததால், எண்களின் ஒலி அளவு சமன் செய்யப்பட்டுள்ளது.
  - variant_id: grid_not_run
    when:
      GRID: NOT_RUN
    text:
      en: 'We made Gnani''s speech recogniser the lab listener for a phone-quality hearing screen spoken entirely by Gnani''s voice: {N_PILOT} pilot trials, then human ears.'
      ta: 'Gnani-இன் குரலால் முழுவதும் பேசப்படும் தொலைபேசித் தரச் செவித்திறன் சோதனைக்கு, Gnani-இன் பேச்சு அறிதல் மாதிரியை ஆய்வக கேட்பவராக்கினோம்: {N_PILOT} முன்னோட்ட முயற்சிகள், பிறகு மனிதச் செவிகள்.'
    slots:
    - N_PILOT
  - variant_id: default
    text:
      en: We made Gnani's speech recogniser the lab listener for a phone-quality hearing screen spoken entirely by Gnani's voice, then checked it on human ears.
      ta: Gnani-இன் குரலால் முழுவதும் பேசப்படும் தொலைபேசித் தரச் செவித்திறன் சோதனைக்கு, Gnani-இன் பேச்சு அறிதல் மாதிரியை ஆய்வக கேட்பவராக்கி, பிறகு மனிதச் செவிகளில் சரிபார்த்தோம்.
- key: pitch.outcome_clause
  surface: README
  variants:
  - variant_id: prisma_unusable
    when:
      SHIP: PRISMA_UNUSABLE
    text:
      en: Prisma's hearing did not behave like a human's; its curves are published and the test ships with level-equalised digits.
      ta: Prisma-வின் கேட்டல் மனிதக் கேட்டலைப் போல நடந்துகொள்ளவில்லை; அதன் வளைவுகள் வெளியிடப்பட்டுள்ளன, எண்களின் ஒலி அளவு சமன் செய்யப்பட்ட நிலையில் சோதனை வெளியிடப்படுகிறது.
  - variant_id: no_panel
    when:
      SHIP: NO_PANEL
    text:
      en: No human calibration panel ran in this build, so the test ships with level-equalised digits.
      ta: இந்தப் பதிப்பில் மனிதர்களைக் கொண்ட அளவுத்திருத்தக் குழு இயங்கவில்லை; அதனால் எண்களின் ஒலி அளவு சமன் செய்யப்பட்ட நிலையில் சோதனை வெளியிடப்படுகிறது.
  - variant_id: human_grid_not_run
    when:
      SHIP: HUMAN
      GRID: NOT_RUN
    text:
      en: Prisma passed its {N_PILOT}-trial pilot, but the full calibration grid did not run, so the shipped digits use the human offsets.
      ta: Prisma தனது {N_PILOT}-முயற்சி முன்னோட்டத்தில் தேறியது; ஆனால் முழு அளவுத்திருத்தக் கட்டம் இயங்கவில்லை; அதனால் வெளியிடப்படும் எண்கள் மனித ஈடுகளைப் பயன்படுத்துகின்றன.
    slots:
    - N_PILOT
  - variant_id: rms_grid_not_run
    when:
      SHIP: RMS
      GRID: NOT_RUN
    text:
      en: Prisma passed its {N_PILOT}-trial pilot, but the full calibration grid did not run, so the test ships with level-equalised digits.
      ta: Prisma தனது {N_PILOT}-முயற்சி முன்னோட்டத்தில் தேறியது; ஆனால் முழு அளவுத்திருத்தக் கட்டம் இயங்கவில்லை; அதனால் எண்களின் ஒலி அளவு சமன் செய்யப்பட்ட நிலையில் சோதனை வெளியிடப்படுகிறது.
    slots:
    - N_PILOT
  - variant_id: prisma
    when:
      SHIP: PRISMA
    text:
      en: Human ears agreed, so Prisma calibrated the shipped digits.
      ta: மனிதச் செவிகளும் ஒப்புக்கொண்டன; அதனால் வெளியிடப்படும் எண்களை Prisma அளவுத்திருத்தம் செய்தது.
  - variant_id: human
    when:
      SHIP: HUMAN
    text:
      en: Human ears were more precise than Prisma, so the shipped digits use the human offsets.
      ta: மனிதச் செவிகள் Prisma-வை விடத் துல்லியமாக இருந்தன; அதனால் வெளியிடப்படும் எண்கள் மனித ஈடுகளைப் பயன்படுத்துகின்றன.
  - variant_id: default
    text:
      en: Prisma's balancing did not make the digits more even for human ears (difference {DIFF_DB} dB), so the test ships with level-equalised digits.
      ta: Prisma-வின் சமநிலைப்படுத்தல் மனிதச் செவிகளுக்கு எண்களை மேலும் சீராக்கவில்லை (வேறுபாடு {DIFF_DB} dB); அதனால் எண்களின் ஒலி அளவு சமன் செய்யப்பட்ட நிலையில் சோதனை வெளியிடப்படுகிறது.
    slots:
    - DIFF_DB
- key: outcome.ship
  surface: README
  variants:
  - variant_id: prisma_unusable
    when:
      SHIP: PRISMA_UNUSABLE
    text:
      en: Prisma's hearing did not behave like a human's in the pilot; its curves are published and the test ships with level-equalised digits.
      ta: முன்னோட்டத்தில் Prisma-வின் கேட்டல் மனிதக் கேட்டலைப் போல நடந்துகொள்ளவில்லை; அதன் வளைவுகள் வெளியிடப்பட்டுள்ளன, எண்களின் ஒலி அளவு சமன் செய்யப்பட்ட நிலையில் சோதனை வெளியிடப்படுகிறது.
  - variant_id: no_panel
    when:
      SHIP: NO_PANEL
    text:
      en: No human calibration panel ran in this build, so the test ships with level-equalised digits.
      ta: இந்தப் பதிப்பில் மனிதர்களைக் கொண்ட அளவுத்திருத்தக் குழு இயங்கவில்லை; அதனால் எண்களின் ஒலி அளவு சமன் செய்யப்பட்ட நிலையில் சோதனை வெளியிடப்படுகிறது.
  - variant_id: human_grid_not_run
    when:
      SHIP: HUMAN
      GRID: NOT_RUN
    text:
      en: Prisma passed its {N_PILOT}-trial pilot, but the full calibration grid did not run; human ears set the shipped digit offsets and Prisma's pilot curves are published.
      ta: Prisma தனது {N_PILOT}-முயற்சி முன்னோட்டத்தில் தேறியது; ஆனால் முழு அளவுத்திருத்தக் கட்டம் இயங்கவில்லை; வெளியிடப்படும் எண்களின் ஈடுகளை மனிதச் செவிகள் தீர்மானித்தன, Prisma-வின் முன்னோட்ட வளைவுகள் வெளியிடப்பட்டுள்ளன.
