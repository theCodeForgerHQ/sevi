    text:
      en: We could not finish the practice rounds, even with the numbers clear. This can happen when the sound is hard to hear. Please get a hearing check with an audiologist or ENT doctor. If you were in a noisy place or were interrupted, please try again.
      ta: எண்கள் தெளிவாக ஒலித்தபோதும் பயிற்சிச் சுற்றுகளை முடிக்க முடியவில்லை. ஒலியைக் கேட்பது கடினமாக இருக்கும்போது இப்படி நடக்கலாம். செவியியல் நிபுணர் அல்லது ENT மருத்துவரிடம் செவித்திறன் பரிசோதனை செய்துகொள்ளுங்கள். சத்தமான இடத்தில் இருந்தாலோ இடையூறு ஏற்பட்டாலோ, மீண்டும் முயலுங்கள்.
