- key: wording.W_NOBAND_LT6.spoken
  surface: SPOKEN
  must_contain: *id003
  variants:
  - variant_id: default
    text:
      en: We do not have enough testers yet to compare your result. This result does not rule out hearing loss. This test plays the sound to both ears together, so it cannot check each ear separately or high pitches. If in doubt, see an audiologist.
      ta: உங்கள் முடிவை ஒப்பிடுவதற்குப் போதுமான சோதனையாளர்கள் எங்களிடம் இன்னும் இல்லை. இந்த முடிவு காது கேளாமை இல்லை என்பதை உறுதிப்படுத்தாது. இந்தச் சோதனை இரண்டு காதுகளுக்கும் ஒரே நேரத்தில் ஒலிக்கிறது; அதனால் ஒவ்வொரு காதையும் தனித்தனியாகவோ உயர் சுருதி ஒலிகளையோ இது சோதிக்காது. சந்தேகம் இருந்தால், செவியியல் நிபுணரைப் பாருங்கள்.
