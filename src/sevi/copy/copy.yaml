- key: prompt.instructions
  surface: PROMPT
  variants:
  - variant_id: default
    text:
      en: Please sit somewhere quiet and use earphones. You will hear three numbers in noise. Enter them in the same order, or say them in voice mode.
      ta: அமைதியான இடத்தில் அமர்ந்து இயர்போன் பயன்படுத்துங்கள். இரைச்சலுக்கு நடுவே மூன்று எண்கள் கேட்கும். அவற்றை அதே வரிசையில் உள்ளிடுங்கள், அல்லது குரல் முறையில் சொல்லுங்கள்.
- key: prompt.volume_intro
