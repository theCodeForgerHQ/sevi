    text:
      en: 'Inconclusive: too many answers did not come through. Not a diagnosis; if in doubt, see an audiologist.'
      ta: 'முடிவு தெளிவில்லை: பல பதில்கள் வந்து சேரவில்லை. நோயறிதல் அல்ல; சந்தேகம் இருந்தால், செவியியல் நிபுணரைப் பாருங்கள்.'
- key: wording.W_INC.spoken
