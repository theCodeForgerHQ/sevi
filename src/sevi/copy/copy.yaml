    text:
      en: 'Incomplete: the test stopped before the end. Not a diagnosis; if in doubt, see an audiologist.'
      ta: 'முழுமையடையவில்லை: சோதனை முடிவதற்கு முன்பே நின்றது. நோயறிதல் அல்ல; சந்தேகம் இருந்தால், செவியியல் நிபுணரைப் பாருங்கள்.'
