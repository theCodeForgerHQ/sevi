- key: wording.W_INCONC.spoken
  surface: SPOKEN
  variants:
  - variant_id: default
    text:
      en: We could not get a clear result. Please try again in a quiet place. This is a screening, not a diagnosis.
      ta: தெளிவான முடிவு கிடைக்கவில்லை. அமைதியான இடத்தில் மீண்டும் முயலுங்கள். இது ஒரு முதற்கட்டச் சோதனை மட்டுமே; மருத்துவ நோயறிதல் அல்ல.
- key: wording.W_INCONC.page
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: We could not get a clear result, because some answers did not come through. Please try again in a quiet place. This is a screening, not a diagnosis. If you are worried about your hearing, see an audiologist.
      ta: சில பதில்கள் சரியாக வந்து சேராததால், தெளிவான முடிவு கிடைக்கவில்லை. அமைதியான இடத்தில் மீண்டும் முயற்சி செய்யுங்கள். இது ஒரு முதற்கட்டச் சோதனை மட்டுமே; மருத்துவ நோயறிதல் அல்ல. உங்கள் செவித்திறன் குறித்துக் கவலை இருந்தால், செவியியல் நிபுணரைப் பாருங்கள்.
