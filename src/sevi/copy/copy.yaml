- key: disclaimer.page
  surface: PAGE
  must_contain: &id003
    en:
    - does not rule out hearing loss
    - each ear separately
    - high pitches
    - audiologist
    ta:
    - காது கேளாமை
    - தனித்தனியாக
    - உயர் சுருதி
    - செவியியல் நிபுணர
  variants:
  - variant_id: default
    text:
      en: Sevi is a screening, not a diagnosis. A pass does not rule out hearing loss. This test plays the sound to both ears together, so it cannot check each ear separately or high pitches. If in doubt, see an audiologist.
      ta: செவி ஒரு முதற்கட்டச் சோதனை மட்டுமே; மருத்துவ நோயறிதல் அல்ல. தேர்ச்சி பெற்றாலும் காது கேளாமை இல்லை என்று சொல்ல முடியாது. இந்தச் சோதனை இரண்டு காதுகளுக்கும் ஒரே நேரத்தில் ஒலிக்கிறது; அதனால் ஒவ்வொரு காதையும் தனித்தனியாகவோ உயர் சுருதி ஒலிகளையோ இது சோதிக்காது. சந்தேகம் இருந்தால், செவியியல் நிபுணரைப் பாருங்கள்.
- key: share.card
  surface: SHARE_CARD
  variants:
  - variant_id: default
    text:
      en: Three numbers are hidden in the noise. Can you hear them? A free hearing screen in your browser, with phone-quality audio. A screening, not a diagnosis.
      ta: இரைச்சலில் மூன்று எண்கள் ஒளிந்திருக்கின்றன. உங்களுக்குக் கேட்கிறதா? உங்கள் உலாவியில் இலவசச் செவித்திறன் முதற்கட்டச் சோதனை, தொலைபேசித் தர ஒலியுடன். முதற்கட்டச் சோதனை மட்டுமே; நோயறிதல் அல்ல.
