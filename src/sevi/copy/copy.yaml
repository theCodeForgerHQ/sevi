    text:
      en: 'Your result: {SRT} dB SNR. That is outside the range of our {N} testers with self-reported normal hearing, in a quiet room (ages {AGES}). This is a screening, not a diagnosis. Please get a hearing check with an audiologist or ENT doctor.'
      ta: 'உங்கள் முடிவு: {SRT} dB SNR. இது எங்கள் {N} அமைதியான அறையில் சோதித்த, சாதாரண செவித்திறன் உள்ளதாகத் தாங்களே தெரிவித்த சோதனையாளர்கள் (வயது {AGES}) பெற்ற வரம்புக்கு வெளியே உள்ளது. இது ஒரு முதற்கட்டச் சோதனை மட்டுமே; மருத்துவ நோயறிதல் அல்ல. செவியியல் நிபுணர் அல்லது ENT மருத்துவரிடம் செவித்திறன் பரிசோதனை செய்துகொள்ளுங்கள்.'
