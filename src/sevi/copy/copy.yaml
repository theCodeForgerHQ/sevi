# Sevi copy table (contracts §4.11, §4.11.1, §4.11.2). Owner: A. Every public string, en + ta.
# Selection: first variant whose `when` all match the outcome values; the `when == {}` default is last.
# Reduced scope: SHIP=NO_PANEL, GRID=NOT_RUN, CARRIER=NOT_RUN, LP_SHIFT=WEAK, PHONE=BROWSER_ONLY.
schema_id: sevi.copy/1
frozen_at: null
banned:
- diagnoses
- diagnose
- clinically proven
- clinical-grade
- medical device
- guaranteed
- your hearing is fine
- your hearing is normal
- normal-hearing people
- hearing test over the phone
- phone call
- over the phone
- any phone
- feature phone
- call this number
- this call
- phone hearing screen
- detects hearing loss
- accurate
- validated
- diagnostic accuracy
- sensitivity
- specificity
referral_keywords:
  en:
  - audiologist
  - hearing check
  ta:
  - செவித்திறன் பரிசோதனை
  - செவியியல் நிபுணர
entries:
- key: ui.landing.title
  surface: LANDING
  variants:
  - variant_id: default
    text:
      en: Sevi
      ta: செவி
- key: ui.landing.subtitle
  surface: LANDING
  must_contain:
    en:
    - phone-quality audio
  variants:
  - variant_id: default
    text:
      en: காது சோதனை · A three-minute hearing screen in your browser, with phone-quality audio.
      ta: காது சோதனை · உங்கள் உலாவியில் மூன்று நிமிடச் செவித்திறன் முதற்கட்டச் சோதனை, தொலைபேசித் தர ஒலியுடன் (phone-quality audio).
- key: ui.landing.start_keypad
  surface: LANDING
  variants:
  - variant_id: default
    text:
      en: Start with the keypad
      ta: விசைப்பலகையுடன் தொடங்குங்கள்
- key: ui.landing.try_voice
  surface: LANDING
  variants:
  - variant_id: default
    text:
      en: Try voice answers (beta)
      ta: குரலில் பதில் சொல்லிப் பாருங்கள் (சோதனை நிலை)
- key: ui.landing.voice_busy
  surface: LANDING
  variants:
  - variant_id: default
    text:
      en: Voice answers are busy right now. The keypad test works the same way.
      ta: குரல் பதில் வசதி இப்போது நிரம்பியுள்ளது. விசைப்பலகைச் சோதனையும் அதே முறையில் செயல்படும்.
- key: ui.landing.watch_video
  surface: LANDING
  variants:
  - variant_id: default
    text:
      en: Watch the one-minute video
      ta: ஒரு நிமிட வீடியோவைப் பாருங்கள்
- key: ui.landing.pilot_line
  surface: LANDING
  variants:
  - variant_id: phone_ok
    when:
      PHONE: OK
    text:
      en: Teammates also tried the test on a small pilot with verified phone numbers.
      ta: சரிபார்க்கப்பட்ட தொலைபேசி எண்களுடன் ஒரு சிறிய முன்னோட்டத்தில் குழு உறுப்பினர்களும் இந்தச் சோதனையை முயன்றனர்.
  - variant_id: default
    text:
      en: Sevi runs in your browser.
      ta: செவி உங்கள் உலாவியில் இயங்குகிறது.
- key: ui.landing.lang_ta
  surface: LANDING
  variants:
  - variant_id: default
    text:
      en: தமிழ் (Tamil)
      ta: தமிழ்
- key: ui.landing.lang_en_experimental
  surface: LANDING
  variants:
  - variant_id: default
    text:
      en: English (experimental, no comparison band)
      ta: English (ஆங்கிலம்; சோதனை நிலை, ஒப்பீட்டு வரம்பு இல்லை)
- key: ui.landing.earphones_question
  surface: LANDING
  variants:
  - variant_id: default
    text:
      en: Are you using earphones?
      ta: நீங்கள் இயர்போன் பயன்படுத்துகிறீர்களா?
- key: ui.landing.earphones_yes
  surface: LANDING
  variants:
  - variant_id: default
    text:
      en: Yes, earphones
      ta: ஆம், இயர்போன்
- key: ui.landing.earphones_no
  surface: LANDING
  variants:
  - variant_id: default
    text:
      en: No, the speaker
      ta: இல்லை, ஸ்பீக்கர்
- key: ui.test.earphones_no_note
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Without earphones your result cannot be compared with our testers. Earphones work better.
      ta: இயர்போன் இல்லாமல், உங்கள் முடிவை எங்கள் சோதனையாளர்களுடன் ஒப்பிட முடியாது. இயர்போன் சிறந்தது.
- key: ui.test.tap_to_start_audio
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Tap to start the sound
      ta: ஒலியைத் தொடங்கத் தட்டுங்கள்
- key: ui.test.allow_mic
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Allow the microphone so we can hear your answers.
      ta: உங்கள் பதில்களைக் கேட்க மைக்ரோஃபோனை அனுமதியுங்கள்.
- key: ui.test.mic_denied_keypad
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: The microphone is not available. Please use the keypad.
      ta: மைக்ரோஃபோன் கிடைக்கவில்லை. விசைப்பலகையைப் பயன்படுத்துங்கள்.
- key: ui.test.voice_switched_keypad
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: We switched you to the keypad.
      ta: உங்களை விசைப்பலகைக்கு மாற்றியுள்ளோம்.
- key: ui.test.speaker_echo_warning
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Your speaker may echo into the microphone. Earphones work better.
      ta: உங்கள் ஸ்பீக்கர் ஒலி மைக்ரோஃபோனில் எதிரொலிக்கலாம். இயர்போன் சிறந்தது.
- key: ui.test.consent_agree
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: I agree, start
      ta: ஒப்புக்கொள்கிறேன், தொடங்கு
- key: ui.test.consent_decline
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: No, thanks
      ta: வேண்டாம், நன்றி
- key: ui.test.phase_instructions
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Please sit somewhere quiet and use earphones. You will hear three numbers in noise; enter them in the same order.
      ta: அமைதியான இடத்தில் அமர்ந்து இயர்போன் பயன்படுத்துங்கள். இரைச்சலுக்கு நடுவே மூன்று எண்கள் கேட்கும்; அவற்றை அதே வரிசையில் உள்ளிடுங்கள்.
- key: ui.test.phase_volume
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Volume check
      ta: ஒலி அளவுச் சரிபார்ப்பு
- key: ui.test.phase_practice
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Practice
      ta: பயிற்சி
- key: ui.test.phase_loud
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Loud check
      ta: உரத்த ஒலிச் சரிபார்ப்பு
- key: ui.test.phase_test
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Test
      ta: சோதனை
- key: ui.test.listen
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Listen
      ta: கேளுங்கள்
- key: ui.test.listening
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Listening…
      ta: கேட்கிறோம்…
- key: ui.test.keypad_hint
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Enter the three numbers you heard
      ta: நீங்கள் கேட்ட மூன்று எண்களை உள்ளிடுங்கள்
- key: ui.test.hear_again
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Hear again
      ta: மீண்டும் கேட்க
- key: ui.test.repeat_instructions
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Repeat the instructions
      ta: வழிமுறைகளை மீண்டும் கேட்க
- key: ui.test.cant_hear
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: I can't hear the numbers
      ta: எனக்கு எண்கள் கேட்கவில்லை
- key: ui.test.cant_hear_confirm
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Are you sure? The test will stop and we will suggest a hearing check.
      ta: உறுதியாகவா? சோதனை நின்றுவிடும்; செவித்திறன் பரிசோதனை செய்துகொள்ளப் பரிந்துரைப்போம்.
- key: ui.test.cant_hear_yes
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Yes, stop the test
      ta: ஆம், சோதனையை நிறுத்து
- key: ui.test.cant_hear_no
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: No, continue
      ta: இல்லை, தொடர்
- key: ui.test.feedback_correct
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Correct
      ta: சரி
- key: ui.test.feedback_wrong
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Not quite
      ta: சரியில்லை
- key: ui.test.interrupted
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: The test was interrupted.
      ta: சோதனை இடையில் நின்றுவிட்டது.
- key: ui.test.session_expired
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: This session has expired.
      ta: இந்த அமர்வு காலாவதியாகிவிட்டது.
- key: ui.test.connection_slow
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Your connection is slow. Please wait.
      ta: உங்கள் இணைப்பு மெதுவாக உள்ளது. சற்றுக் காத்திருங்கள்.
- key: ui.test.start_again
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Start again
      ta: மீண்டும் தொடங்கு
- key: ui.queue.position
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: You are in the queue for voice answers.
      ta: குரல் பதில் வசதிக்கான வரிசையில் நீங்கள் காத்திருக்கிறீர்கள்.
- key: ui.queue.take_keypad
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Use the keypad now instead
      ta: அதற்குப் பதிலாக இப்போதே விசைப்பலகையைப் பயன்படுத்துங்கள்
- key: ui.wait.room
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Many people are taking the test. Please wait a moment.
      ta: பலர் சோதனை செய்துகொண்டிருக்கிறார்கள். சற்றுக் காத்திருங்கள்.
- key: ui.rate_limited
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Too many tries in a short time. Please try again in a few minutes.
      ta: குறுகிய நேரத்தில் பல முயற்சிகள். சில நிமிடங்கள் கழித்து முயற்சி செய்யுங்கள்.
- key: ui.voice_unavailable
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Voice answers are not available right now. Please use the keypad.
      ta: குரல் பதில் வசதி இப்போது கிடைக்கவில்லை. விசைப்பலகையைப் பயன்படுத்துங்கள்.
- key: ui.back_soon
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Sevi is resting for a moment. Please come back soon.
      ta: செவி சற்று ஓய்வில் உள்ளது. சிறிது நேரம் கழித்து வாருங்கள்.
- key: ui.result.report_link
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Your report (kept for 72 hours)
      ta: உங்கள் அறிக்கை (72 மணி நேரம் வைத்திருக்கப்படும்)
- key: ui.result.share
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Share Sevi
      ta: செவியைப் பகிருங்கள்
- key: ui.result.explanation_label
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: What this means
      ta: இதன் பொருள்
- key: ui.result.not_on_device
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: This result is not saved on your device.
      ta: இந்த முடிவு உங்கள் சாதனத்தில் சேமிக்கப்படவில்லை.
- key: ui.report.title
  surface: REPORT
  variants:
  - variant_id: default
    text:
      en: Sevi screening report
      ta: செவி முதற்கட்டச் சோதனை அறிக்கை
- key: ui.report.expired
  surface: REPORT
  variants:
  - variant_id: default
    text:
      en: 'This report is no longer available: we delete our copy after 72 hours.'
      ta: 'இந்த அறிக்கை இனி கிடைக்காது: எங்களிடம் உள்ள நகலை 72 மணி நேரத்திற்குப் பிறகு நீக்குகிறோம்.'
- key: ui.report.trials_heading
  surface: REPORT
  variants:
  - variant_id: default
    text:
      en: Your answers, trial by trial
      ta: ஒவ்வொரு முயற்சியிலும் உங்கள் பதில்கள்
# Web-client strings (rendered by web/static/js; {k} {n} {when} {pos} {min} are filled by the client).
- key: ui.landing.read_consent
  surface: LANDING
  variants:
  - variant_id: default
    text:
      en: Read what we collect and why
      ta: நாங்கள் எதைச் சேகரிக்கிறோம், ஏன் என்று படியுங்கள்
- key: ui.landing.not_diagnosis
  surface: LANDING
  variants:
  - variant_id: default
    text:
      en: Sevi is a screening, not a diagnosis.
      ta: செவி ஒரு முதற்கட்டச் சோதனை மட்டுமே; மருத்துவ நோயறிதல் அல்ல.
- key: ui.landing.language
  surface: LANDING
  variants:
  - variant_id: default
    text:
      en: Language
      ta: மொழி
- key: ui.test.round
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Round {k} of {n}
      ta: சுற்று {k} / {n}
    slots:
    - k
    - n
- key: ui.test.connecting
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Connecting
      ta: இணைக்கிறது
- key: ui.result.title
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Your result
      ta: உங்கள் முடிவு
- key: ui.result.expiry_note
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: We delete our copy after 72 hours.
      ta: எங்களிடம் உள்ள நகலை 72 மணி நேரத்திற்குப் பிறகு நீக்குகிறோம்.
- key: ui.result.copied
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Link copied
      ta: இணைப்பு நகலெடுக்கப்பட்டது
- key: ui.report.print
  surface: REPORT
  variants:
  - variant_id: default
    text:
      en: Print
      ta: அச்சிடு
- key: ui.report.correct
  surface: REPORT
  variants:
  - variant_id: default
    text:
      en: Correct
      ta: சரி
- key: ui.report.yes
  surface: REPORT
  variants:
  - variant_id: default
    text:
      en: 'Yes'
      ta: ஆம்
- key: ui.report.no
  surface: REPORT
  variants:
  - variant_id: default
    text:
      en: 'No'
      ta: இல்லை
- key: ui.report.expires
  surface: REPORT
  variants:
  - variant_id: default
    text:
      en: Available until {when} IST
      ta: '{when} IST வரை கிடைக்கும்'
    slots:
    - when
- key: ui.wait.ahead
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: '{n} people ahead of you'
      ta: உங்களுக்கு முன் {n} பேர்
    slots:
    - n
- key: ui.queue.detail
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Position {pos}, about {min} min
      ta: வரிசையில் இடம் {pos}, சுமார் {min} நிமிடம்
    slots:
    - pos
    - min
- key: ui.error.generic
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: Something went wrong. Please try again.
      ta: ஏதோ தவறு நேர்ந்தது. மீண்டும் முயற்சி செய்யுங்கள்.
- key: ui.banner.unsupported_browser
  surface: PAGE
  variants:
  - variant_id: default
    text:
      en: This browser cannot play the test sound. Please use a recent Chrome, Safari or Firefox.
      ta: இந்த உலாவியில் சோதனை ஒலியை இயக்க முடியாது. Chrome, Safari அல்லது Firefox-இன் புதிய பதிப்பைப் பயன்படுத்துங்கள்.
- key: consent.public.page
  surface: PAGE
  must_contain: &id001
    en:
    - Gnani
    - Tailscale
    - Cloudflare
    - GitHub
    - 72 hours
    ta:
    - Gnani
    - Tailscale
    - Cloudflare
    - GitHub
    - 72 மணி நேர
  variants:
  - variant_id: default
    text:
      en: Sevi is a three-minute hearing screen in your browser. It is a screening, not a diagnosis. You must be 18 or older. In voice mode, Gnani processes your spoken answers to turn them into text. Tailscale relays the encrypted connection and cannot read it. Cloudflare carries the connection only while our backup link is on. GitHub hosts this page. We delete our copy of your answers after 72 hours. We do not ask for your name or phone number.
      ta: செவி என்பது உங்கள் உலாவியில் மூன்று நிமிடச் செவித்திறன் முதற்கட்டச் சோதனை. இது முதற்கட்டச் சோதனை மட்டுமே; மருத்துவ நோயறிதல் அல்ல. நீங்கள் 18 வயது அல்லது அதற்கு மேற்பட்டவராக இருக்க வேண்டும். குரல் முறையில், நீங்கள் சொல்லும் பதில்களை எழுத்தாக மாற்ற Gnani அவற்றைச் செயலாக்குகிறது. Tailscale மறைகுறியாக்கப்பட்ட இணைப்பை அனுப்புகிறது; அதை அதனால் படிக்க முடியாது. எங்கள் மாற்று இணைப்பு இயங்கும்போது மட்டுமே Cloudflare இணைப்பைக் கொண்டு செல்கிறது. GitHub இந்தப் பக்கத்தை வழங்குகிறது. உங்கள் பதில்களின் எங்கள் நகலை 72 மணி நேரத்திற்குப் பிறகு நீக்குகிறோம். உங்கள் பெயரையோ தொலைபேசி எண்ணையோ நாங்கள் கேட்பதில்லை.
- key: consent.study.page
  surface: PAGE
  must_contain: *id001
  variants:
