- key: outcome.channel_check
  surface: README
  variants:
  - variant_id: match
    when:
      CARRIER: MATCH
    text:
      en: On a real mobile call between two teammates' phones, Prisma's 50 % point moved by {DELTA_P50} dB and the speech-to-noise ratio by {DELTA_SNR} dB compared with our simulated phone channel.
      ta: இரண்டு குழு உறுப்பினர்களின் கைபேசிகளுக்கு இடையேயான உண்மையான அழைப்பில், எங்கள் உருவகத் தொலைபேசி வழியுடன் ஒப்பிடும்போது Prisma-வின் 50 % புள்ளி {DELTA_P50} dB-யும், பேச்சு-இரைச்சல் விகிதம் {DELTA_SNR} dB-யும் நகர்ந்தன.
    slots:
    - DELTA_P50
    - DELTA_SNR
  - variant_id: differs
    when:
      CARRIER: DIFFERS
    text:
      en: On a real mobile call between two teammates' phones, Prisma's 50 % point moved by {DELTA_P50} dB compared with our simulated phone channel, so results on the simulated channel may not carry over to real calls.
      ta: இரண்டு குழு உறுப்பினர்களின் கைபேசிகளுக்கு இடையேயான உண்மையான அழைப்பில், எங்கள் உருவகத் தொலைபேசி வழியுடன் ஒப்பிடும்போது Prisma-வின் 50 % புள்ளி {DELTA_P50} dB நகர்ந்தது; அதனால் உருவக வழியின் முடிவுகள் உண்மையான அழைப்புகளுக்குப் பொருந்தாமல் போகலாம்.
    slots:
    - DELTA_P50
  - variant_id: default
    text:
      en: Our phone-quality channel is simulated; we did not measure a real carrier.
      ta: எங்கள் தொலைபேசித் தர ஒலிவழி உருவகப்படுத்தப்பட்டது; உண்மையான தொலைத்தொடர்பு வழியை நாங்கள் அளவிடவில்லை.
- key: post.linkedin
  surface: POST_LINKEDIN
  must_contain: &id005
    en:
    - Comment what you heard at 0:03, then send it to your parents.
    - first comment
  variants:
  - variant_id: no_panel_voice_public
    when:
      SHIP: NO_PANEL
      VOICE: PUBLIC
    text:
      en: 'உங்கள் காதுகளுக்கு இந்த இரைச்சலில் மூன்று எண்கள் கேட்கிறதா? (Can your ears hear three numbers in this noise?)


        We built a 3-minute phone-quality hearing screen (Tamil, plus experimental English) where every voice is Gnani Timbre and spoken answers are scored by Gnani Prisma.


        No human calibration panel ran in this build, so the test ships with level-equalised digits. A screening, not a diagnosis.


        Comment what you heard at 0:03, then send it to your parents. The test link is in the first comment.'
      ta: 'உங்கள் காதுகளுக்கு இந்த இரைச்சலில் மூன்று எண்கள் கேட்கிறதா?


        மூன்று நிமிடத் தொலைபேசித் தரச் செவித்திறன் சோதனையை (தமிழ், மேலும் சோதனை நிலையில் ஆங்கிலம்) உருவாக்கினோம்; ஒவ்வொரு குரலும் Gnani Timbre, சொல்லப்படும் பதில்களை Gnani Prisma மதிப்பிடுகிறது.


        இந்தப் பதிப்பில் மனிதர்களைக் கொண்ட அளவுத்திருத்தக் குழு இயங்கவில்லை; அதனால் எண்களின் ஒலி அளவு சமன் செய்யப்பட்ட நிலையில் சோதனை வெளியிடப்படுகிறது. முதற்கட்டச் சோதனை மட்டுமே; நோயறிதல் அல்ல.


        0:03-இல் நீங்கள் கேட்டதை கமெண்ட் செய்யுங்கள், பிறகு உங்கள் பெற்றோருக்கு அனுப்புங்கள். சோதனை இணைப்பு முதல் கமெண்டில் (first comment) உள்ளது.'
  - variant_id: no_panel_voice_off
    when:
      SHIP: NO_PANEL
      VOICE: 'OFF'
    text:
      en: 'உங்கள் காதுகளுக்கு இந்த இரைச்சலில் மூன்று எண்கள் கேட்கிறதா? (Can your ears hear three numbers in this noise?)


        We built a 3-minute phone-quality hearing screen (Tamil, plus experimental English) where every voice is Gnani Timbre and you answer on the keypad.


        No human calibration panel ran in this build, so the test ships with level-equalised digits. A screening, not a diagnosis.


        Comment what you heard at 0:03, then send it to your parents. The test link is in the first comment.'
      ta: 'உங்கள் காதுகளுக்கு இந்த இரைச்சலில் மூன்று எண்கள் கேட்கிறதா?


        மூன்று நிமிடத் தொலைபேசித் தரச் செவித்திறன் சோதனையை (தமிழ், மேலும் சோதனை நிலையில் ஆங்கிலம்) உருவாக்கினோம்; ஒவ்வொரு குரலும் Gnani Timbre, நீங்கள் விசைப்பலகையில் பதில் அளிக்கிறீர்கள்.


        இந்தப் பதிப்பில் மனிதர்களைக் கொண்ட அளவுத்திருத்தக் குழு இயங்கவில்லை; அதனால் எண்களின் ஒலி அளவு சமன் செய்யப்பட்ட நிலையில் சோதனை வெளியிடப்படுகிறது. முதற்கட்டச் சோதனை மட்டுமே; நோயறிதல் அல்ல.


        0:03-இல் நீங்கள் கேட்டதை கமெண்ட் செய்யுங்கள், பிறகு உங்கள் பெற்றோருக்கு அனுப்புங்கள். சோதனை இணைப்பு முதல் கமெண்டில் (first comment) உள்ளது.'
