  - variant_id: rms_grid_not_run
    when:
      SHIP: RMS
      GRID: NOT_RUN
    text:
      en: Prisma passed its {N_PILOT}-trial pilot, but the full calibration grid did not run, so Prisma's balancing was never tested on people; the test ships with level-equalised digits.
      ta: Prisma தனது {N_PILOT}-முயற்சி முன்னோட்டத்தில் தேறியது; ஆனால் முழு அளவுத்திருத்தக் கட்டம் இயங்கவில்லை; அதனால் Prisma-வின் சமநிலைப்படுத்தல் மனிதர்களிடம் சோதிக்கப்படவில்லை; எண்களின் ஒலி அளவு சமன் செய்யப்பட்ட நிலையில் சோதனை வெளியிடப்படுகிறது.
    slots:
    - N_PILOT
  - variant_id: prisma
    when:
      SHIP: PRISMA
    text:
      en: 'They did: Prisma''s balancing made the digits more even for people too (human spread {X} → {Y} dB).'
      ta: 'ஆம்: Prisma-வின் சமநிலைப்படுத்தல் மனிதர்களுக்கும் எண்களைச் சீராக்கியது (மனிதப் பரவல் {X} → {Y} dB).'
    slots:
    - X
    - Y
  - variant_id: human
    when:
      SHIP: HUMAN
    text:
      en: 'Partly: human ears had the final say (Prisma–human correction r = {R} [{CI}]); Prisma''s curves are published.'
      ta: 'ஓரளவு: இறுதி முடிவை மனிதச் செவிகள் எடுத்தன (Prisma–மனிதத் திருத்தம் r = {R} [{CI}]); Prisma-வின் வளைவுகள் வெளியிடப்பட்டுள்ளன.'
    slots:
    - R
    - CI
  - variant_id: default
    text:
      en: 'They didn''t: Prisma''s balancing changed human spread by {Z} dB. Measured, published, and the test ships with level-equalised digits.'
      ta: 'இல்லை: Prisma-வின் சமநிலைப்படுத்தல் மனிதப் பரவலை {Z} dB மாற்றியது. அளவிடப்பட்டு, வெளியிடப்பட்டு, எண்களின் ஒலி அளவு சமன் செய்யப்பட்ட நிலையில் சோதனை வெளியிடப்படுகிறது.'
    slots:
    - Z
- key: outcome.lp_shift
  surface: README
  variants:
  - variant_id: ok
    when:
      LP_SHIFT: OK
    text:
      en: 'On sound filtered to simulate high-frequency hearing loss, the result rose by {d} dB (pre-registered: {p} dB).'
      ta: 'உயர் அதிர்வெண் காது கேளாமையைப் போல வடிகட்டப்பட்ட ஒலியில், முடிவு {d} dB உயர்ந்தது (முன்பதிவு செய்த அளவு: {p} dB).'
    slots:
    - d
    - p
  - variant_id: default
    text:
      en: In this build we have not shown that the test separates simulated hearing loss from normal hearing.
      ta: உருவகப்படுத்தப்பட்ட காது கேளாமையைச் சாதாரண கேட்டலிலிருந்து இந்தச் சோதனை பிரித்தறிகிறது என்பதை இந்தப் பதிப்பில் நாங்கள் இன்னும் காட்டவில்லை.
