name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types (contracts, core)
        run: uv run mypy --strict src/sevi/contracts src/sevi/core
      - name: Tests (no live)
        env:
          SEVI_ALLOW_LIVE: "0"
        run: uv run pytest -m "not live" --cov --cov-report=term-missing
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web client tests
        run: node --test web/tests/*.test.mjs
